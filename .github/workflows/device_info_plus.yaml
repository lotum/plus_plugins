# Build Device Info Plus Example
name: device_info_plus

concurrency:
  group: device_info_plus_${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

on:
  pull_request:
    paths:
      - "packages/device_info_plus/**"
      - ".github/workflows/device_info_plus.yaml"
      - "!**.md"
      - "!**.gitignore"

env:
  PLUGIN_SCOPE: "*device_info_plus*"
  PLUGIN_EXAMPLE_SCOPE: "*device_info_plus_example*"

jobs:
  android_build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: "Install Flutter"
        run: ./.github/workflows/scripts/install-flutter.sh 3.7.12
      - name: "Install Tools"
        run: ./.github/workflows/scripts/install-tools.sh

      # Required for Android builds
      - uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Build Example"
        run: ./.github/workflows/scripts/build-examples.sh android ./lib/main.dart

  android_integration_test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      matrix:
        android-api-level: [ 21, 26, 32 ]

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: "Install Flutter"
        run: ./.github/workflows/scripts/install-flutter.sh 3.7.12
      - name: "Install Tools"
        run: ./.github/workflows/scripts/install-tools.sh

      # Required for Android builds
      - uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Bootstrap Workspace"
        run: melos bootstrap
      - name: "Enable KVM"
        run: sudo chmod a+rw /dev/kvm
      - name: "Android Integration Test"
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.android-api-level }}
          cores: 3
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          profile: Nexus 5X
          script: ./.github/workflows/scripts/integration-test.sh android device_info_plus_example

  ios:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: "Install Flutter"
        run: ./.github/workflows/scripts/install-flutter.sh 3.7.12
      - name: "Install Tools"
        run: ./.github/workflows/scripts/install-tools.sh
      - name: "Build Example"
        run: ./.github/workflows/scripts/build-examples.sh ios ./lib/main.dart

  ios_integration_test:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: "Install Flutter"
        run: ./.github/workflows/scripts/install-flutter.sh 3.7.12
      - name: "Install Tools"
        run: ./.github/workflows/scripts/install-tools.sh
      - name: "Start Simulator"
        uses: futureware-tech/simulator-action@ee05c113b79f056b47f354d7b313555f5491e158 # v2
        with:
          model: 'iPhone 16 Pro'
      - name: "Run Integration Test"
        run: ./.github/workflows/scripts/integration-test.sh ios device_info_plus_example

  macos:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: "Install Flutter"
        run: ./.github/workflows/scripts/install-flutter.sh 3.7.12
      - name: "Install Tools"
        run: ./.github/workflows/scripts/install-tools.sh
      - name: "Build Example"
        run: ./.github/workflows/scripts/build-examples.sh macos ./lib/main.dart


  macos_integration_test:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      # Use till https://github.com/flutter/flutter/issues/118469 is resolved
      - name: "Install Flutter"
        uses: flutter-actions/setup-flutter@adb607ae976a9e00473569facfc69813c637a060 # v4.3
        with:
          version: '3.3.10'
      - name: "Install Tools"
        run: ./.github/workflows/scripts/install-tools.sh
      - name: "Run Integration Test"
        run: ./.github/workflows/scripts/integration-test.sh macos device_info_plus_example

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: "Install Flutter"
        run: ./.github/workflows/scripts/install-flutter.sh 3.7.12
      - name: "Install Tools"
        run: ./.github/workflows/scripts/install-tools.sh
      - name: "Build Example"
        run: ./.github/workflows/scripts/build-examples.sh linux ./lib/main.dart

  linux_integration_test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: "Install Flutter"
        run: ./.github/workflows/scripts/install-flutter.sh 3.7.12
      - name: "Install Tools"
        run: ./.github/workflows/scripts/install-tools.sh
      - name: "Run Integration Test"
        run: ./.github/workflows/scripts/integration-test.sh linux device_info_plus_example

  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: "Install Flutter"
        run: ./.github/workflows/scripts/install-flutter.sh 3.7.12
      - name: "Install Tools"
        run: ./.github/workflows/scripts/install-tools.sh
      - name: "Build Example"
        run: ./.github/workflows/scripts/build-examples.sh windows ./lib/main.dart

  windows_integration_test:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: "Install Flutter"
        run: ./.github/workflows/scripts/install-flutter.sh 3.7.12
      - name: "Install Tools"
        run: ./.github/workflows/scripts/install-tools.sh
      - name: "Run Integration Test"
        run: ./.github/workflows/scripts/integration-test.sh windows device_info_plus_example

  web:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: "Install Flutter"
        run: ./.github/workflows/scripts/install-flutter.sh 3.7.12
      - name: "Install Tools"
        run: ./.github/workflows/scripts/install-tools.sh
      - name: "Build Example"
        run: ./.github/workflows/scripts/build-examples.sh web ./lib/main.dart
